name: release

# Pushing a tag like v0.1.0 builds the tools for each platform and publishes them as a release.
# The packages hold only Clockwork's own tools: no game code, which is only ever made from a
# player's own dump on their own PC.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest # Apple Silicon
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace --release
      # the relay server for Rooms is just sockets, so it builds without CMake or SDL
      - name: Build clockwork-relay
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            clang++ -std=c++20 -O2 -DNOMINMAX -DWIN32_LEAN_AND_MEAN -Iruntime/src \
              runtime/src/net/relay.cpp runtime/src/net/relay_main.cpp -lws2_32 -o clockwork-relay.exe
          else
            clang++ -std=c++20 -O2 -Iruntime/src runtime/src/net/relay.cpp runtime/src/net/relay_main.cpp -o clockwork-relay
            strip clockwork-relay
          fi
      - name: Package
        shell: bash
        run: |
          d=clockwork-tools-${{ matrix.name }}
          mkdir "$d"
          x=; [ "$RUNNER_OS" = Windows ] && x=.exe
          cp target/release/ctrx$x target/release/recomp$x clockwork-relay$x "$d/"
          cat > "$d/README.txt" <<'EOF'
          Clockwork tools
          ===============

          ctrx             unpacks a decrypted 3DS dump:  ctrx <dump.3ds|dump.cci> <out_dir>
          recomp           recompiles an unpacked game to C:  recomp emit <unpacked_dir> <out_dir>
          clockwork-relay  the Rooms server for local wireless play over the internet
                           (UDP port 47830 by default; --port N to change it)

          No game code or assets are included. You play from dumps of cartridges you own; see
          https://github.com/clockwork-recompdev/clockwork for building the games.
          EOF
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "$d.zip" "$d" > /dev/null
          else
            tar czf "$d.tar.gz" "$d"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: clockwork-tools-*.*

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "${{ github.ref_type }}" != tag ]; then
            echo "Not a tag: packages are attached to this run only."
            exit 0
          fi
          gh release create "$TAG" clockwork-tools-* --repo "$GITHUB_REPOSITORY" --title "Clockwork $TAG" \
            --notes "Clockwork's tools for Windows, Linux and macOS (Apple Silicon): ctrx, recomp and clockwork-relay. No game code or assets are included."
