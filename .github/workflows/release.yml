name: release

# Pushing a tag like v0.2.0 builds Clockwork for each platform (tools/package.sh) and publishes it
# as a release. The packages hold no game code: the launcher builds each game from the player's
# own dump, on their PC.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  SDL_VERSION: release-3.4.16

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest # Apple Silicon
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace --release

      - name: Libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf libcurl4-openssl-dev libarchive-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev libxfixes-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev \
            libdecor-0-dev libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev libibus-1.0-dev
          git clone --depth 1 -b "$SDL_VERSION" https://github.com/libsdl-org/SDL.git sdl
          cmake -S sdl -B sdl/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/sdl-install"
          cmake --build sdl/build
          cmake --install sdl/build
          echo "CMAKE_PREFIX_PATH=$PWD/sdl-install" >> "$GITHUB_ENV"
      - name: Libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja sdl3 libarchive dylibbundler
          echo "CMAKE_PREFIX_PATH=$(brew --prefix libarchive):$(brew --prefix sdl3)" >> "$GITHUB_ENV"
      - name: Libraries (Windows)
        if: runner.os == 'Windows'
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install "sdl3[vulkan]" curl libarchive --triplet x64-windows
          echo "CMAKE_ARGS=-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows" >> "$GITHUB_ENV"

      - name: Build
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            cmake -B build $CMAKE_ARGS
            cmake --build build --config Release --target clockwork clockwork-relay
            echo "BIN=build/Release" >> "$GITHUB_ENV"
          else
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build build --target clockwork clockwork-relay
            echo "BIN=build" >> "$GITHUB_ENV"
          fi
      - name: Package
        run: tools/package.sh ${{ matrix.name }} "$BIN"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/clockwork-*.*

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "${{ github.ref_type }}" != tag ]; then
            echo "Not a tag: the packages are attached to this run only."
            exit 0
          fi
          gh release create "$TAG" clockwork-* --repo "$GITHUB_REPOSITORY" --title "Clockwork $TAG" --notes \
            "Clockwork for Windows, Linux and macOS (Apple Silicon). No game is included: the launcher builds each game from a dump of your own cartridge, on your PC, which needs a C compiler (see README.txt in the package)."
